<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" role="img" aria-labelledby="speed-sloth-title">
  <title id="speed-sloth-title">A sleepy, smiling sloth zooming along in a red race car</title>

  <!-- Speed lines -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="6" y1="78" x2="44" y2="78"/>
    <line x1="16" y1="98" x2="50" y2="98"/>
    <line x1="2" y1="118" x2="40" y2="118"/>
  </g>

  <!-- Sloth arm resting on the side, then the head -->
  <!-- Head -->
  <g transform="translate(118 58)">
    <ellipse cx="0" cy="0" rx="34" ry="30" fill="#a16207"/>
    <!-- Lighter face -->
    <ellipse cx="0" cy="6" rx="27" ry="21" fill="#fde7c4"/>
    <!-- Eye patches -->
    <ellipse cx="-12" cy="2" rx="10" ry="7" fill="#713f12" transform="rotate(-18 -12 2)"/>
    <ellipse cx="12" cy="2" rx="10" ry="7" fill="#713f12" transform="rotate(18 12 2)"/>
    <!-- Sleepy closed eyes -->
    <path d="M-17 3 Q-12 7 -7 3" stroke="#1c1917" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M7 3 Q12 7 17 3" stroke="#1c1917" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- Nose and content smile -->
    <ellipse cx="0" cy="12" rx="5" ry="3.5" fill="#1c1917"/>
    <path d="M-8 19 Q0 25 8 19" stroke="#1c1917" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- Racing goggles pushed up on the forehead -->
    <rect x="-24" y="-22" width="48" height="8" rx="4" fill="#0ea5e9"/>
    <circle cx="-11" cy="-18" r="7" fill="#bae6fd" stroke="#0369a1" stroke-width="2.5"/>
    <circle cx="11" cy="-18" r="7" fill="#bae6fd" stroke="#0369a1" stroke-width="2.5"/>
  </g>

  <!-- Car body -->
  <path d="M54 118 Q58 96 86 92 L102 92 Q112 78 150 80 L176 82 Q196 84 210 98 L238 104 Q248 108 246 120 L244 128 L56 128 Z" fill="#ef4444"/>
  <!-- Cockpit edge in front of the sloth -->
  <path d="M96 94 Q118 84 150 86 L158 96 L92 98 Z" fill="#b91c1c"/>
  <!-- Long slow arm draped over the side, claws dangling -->
  <path d="M138 96 Q156 100 160 116" stroke="#a16207" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M157 117 l-3 9 M161 118 l0 9 M165 117 l3 8" stroke="#44403c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Racing stripe and number -->
  <rect x="60" y="110" width="184" height="6" fill="#ffffff" opacity="0.85"/>
  <circle cx="206" cy="108" r="13" fill="#ffffff"/>
  <text x="206" y="113" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#b91c1c">5</text>
  <!-- Spoiler -->
  <path d="M56 100 L44 84 L70 84 L76 98 Z" fill="#b91c1c"/>
  <!-- Exhaust puffs -->
  <circle cx="44" cy="124" r="6" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="32" cy="128" r="4.5" fill="#cbd5e1" opacity="0.6"/>

  <!-- Wheels -->
  <circle cx="90" cy="130" r="20" fill="#1f2937"/>
  <circle cx="90" cy="130" r="8" fill="#9ca3af"/>
  <circle cx="212" cy="130" r="20" fill="#1f2937"/>
  <circle cx="212" cy="130" r="8" fill="#9ca3af"/>

  <!-- Zzz: going fast but not really thinking -->
  <text x="160" y="26" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#7dd3fc">z</text>
  <text x="172" y="16" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#7dd3fc">z</text>
  <text x="188" y="8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#7dd3fc">z</text>
</svg>
