<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="gerald-title">
  <title id="gerald-title">Gerald the raccoon, looking sad and holding an empty folder</title>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
  </defs>

  <!-- Striped tail -->
  <g transform="rotate(-28 190 200)">
    <rect x="168" y="120" width="40" height="120" rx="20" fill="#6b7280"/>
    <rect x="168" y="140" width="40" height="14" fill="#1f2937"/>
    <rect x="168" y="170" width="40" height="14" fill="#1f2937"/>
    <rect x="168" y="200" width="40" height="14" fill="#1f2937"/>
    <path d="M168 140 v-0 a20 20 0 0 1 40 0" fill="none"/>
    <circle cx="188" cy="128" r="16" fill="#1f2937"/>
  </g>

  <!-- Body -->
  <ellipse cx="120" cy="198" rx="62" ry="54" fill="url(#fur)"/>
  <ellipse cx="120" cy="208" rx="38" ry="36" fill="#e5e7eb"/>

  <!-- Feet -->
  <ellipse cx="88" cy="248" rx="20" ry="10" fill="#1f2937"/>
  <ellipse cx="152" cy="248" rx="20" ry="10" fill="#1f2937"/>

  <!-- Ears -->
  <path d="M58 70 L48 22 L92 46 Z" fill="#6b7280"/>
  <path d="M182 70 L192 22 L148 46 Z" fill="#6b7280"/>
  <path d="M62 60 L56 34 L82 48 Z" fill="#f9a8d4"/>
  <path d="M178 60 L184 34 L158 48 Z" fill="#f9a8d4"/>

  <!-- Head -->
  <ellipse cx="120" cy="92" rx="72" ry="58" fill="url(#fur)"/>
  <path d="M60 112 Q120 160 180 112 Q170 138 120 146 Q70 138 60 112 Z" fill="#e5e7eb"/>
  <path d="M84 44 Q120 30 156 44 Q140 60 120 58 Q100 60 84 44 Z" fill="#e5e7eb"/>

  <!-- Bandit mask -->
  <path d="M48 92 Q70 62 104 84 Q120 92 136 84 Q170 62 192 92 Q176 120 140 108 Q120 102 100 108 Q64 120 48 92 Z" fill="#111827"/>

  <!-- Big sad eyes, looking down -->
  <circle cx="84" cy="94" r="13" fill="#ffffff"/>
  <circle cx="156" cy="94" r="13" fill="#ffffff"/>
  <circle cx="84" cy="100" r="7" fill="#111827"/>
  <circle cx="156" cy="100" r="7" fill="#111827"/>
  <circle cx="86" cy="97" r="2.2" fill="#ffffff"/>
  <circle cx="158" cy="97" r="2.2" fill="#ffffff"/>
  <!-- Droopy brows -->
  <path d="M68 80 Q84 76 98 66" stroke="#e5e7eb" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M142 66 Q156 76 172 80" stroke="#e5e7eb" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- A tear -->
  <path d="M70 108 Q64 120 70 124 Q76 120 70 108 Z" fill="#7dd3fc"/>

  <!-- Nose and frown -->
  <ellipse cx="120" cy="118" rx="10" ry="7" fill="#111827"/>
  <path d="M104 136 Q120 126 136 136" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Folder of your data, clutched to his chest -->
  <g transform="rotate(-8 120 196)">
    <path d="M78 168 h30 l8 8 h50 v56 h-88 Z" fill="#f59e0b"/>
    <rect x="78" y="176" width="88" height="56" rx="3" fill="#fbbf24"/>
    <text x="122" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#78350f">NO</text>
    <text x="122" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#78350f">DATA</text>
  </g>

  <!-- Paws gripping the folder -->
  <ellipse cx="76" cy="200" rx="13" ry="11" fill="#1f2937"/>
  <ellipse cx="166" cy="190" rx="13" ry="11" fill="#1f2937"/>
</svg>
